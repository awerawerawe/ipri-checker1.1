<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>
アイプリ★4 所持率チェッカー
</title>

<style>

body {
    margin:0;
    font-family:
    "Hiragino Kaku Gothic ProN",
    "Yu Gothic",
    sans-serif;

    background:#fff4fb;
    color:#444;
}


header {

    background:
    linear-gradient(
        135deg,
        #ff8fd8,
        #b58cff
    );

    color:white;
    padding:20px;
    text-align:center;

}


h1 {
    margin:0;
    font-size:24px;
}



main {

    max-width:1000px;
    margin:auto;
    padding:15px;

}



.box {

    background:white;

    border-radius:20px;

    padding:15px;

    margin-bottom:15px;

    box-shadow:
    0 5px 15px rgba(0,0,0,0.1);

}



.rate {

    font-size:28px;

    font-weight:bold;

    text-align:center;

    color:#ff5bbd;

}



.progress {

    background:#eee;

    height:20px;

    border-radius:20px;

    overflow:hidden;

}



.progress span {

    display:block;

    height:100%;

    width:0%;

    background:
    linear-gradient(
        90deg,
        #ff6acb,
        #9d8cff
    );

}



input,
select,
button {


    width:100%;

    padding:12px;

    margin-top:8px;

    border-radius:12px;

    border:1px solid #ddd;

    font-size:16px;

}



.filter {

    display:grid;

    grid-template-columns:
    repeat(auto-fit,minmax(150px,1fr));

    gap:10px;

}



.radio-area {

    display:flex;

    gap:15px;

    flex-wrap:wrap;

}



.radio-area label {

    background:#ffe6f5;

    padding:8px 12px;

    border-radius:20px;

}




#card-list {


    display:grid;

    grid-template-columns:
    repeat(
        auto-fill,
        minmax(150px,1fr)
    );

    gap:15px;

}




.card {


    background:white;

    border-radius:15px;

    overflow:hidden;

    box-shadow:
    0 3px 10px rgba(0,0,0,.1);

    text-align:center;

    padding-bottom:10px;


}



.card img {


    width:100%;

    aspect-ratio:3/4;

    object-fit:cover;

    background:#eee;


}



.card button {


    width:90%;

    background:#ff8fd8;

    color:white;

    border:none;


}



.favorite {


    color:#ff4081;

    font-size:22px;

}

footer {

    text-align:center;

    padding:20px;

    color:#888;

}

.remain{
  margin-top:5px;
  color:#666;
  font-size:14px;
}


/* スマホ調整 */

@media(max-width:600px){

h1{
    font-size:20px;
}


#card-list{

    grid-template-columns:
    repeat(2,1fr);

}

}

/* シリーズ進捗バー */

.series-stat{
  margin-bottom:15px;
}

.progress-bar{
  width:100%;
  height:20px;
  background:#ddd;
  border-radius:10px;
  overflow:hidden;
}

.progress-fill{
  height:100%;
  background:linear-gradient(
    90deg,
    #ff8fd8,
    #b58cff,
    #7fdcff
  );
  text-align:center;
  color:white;
  font-size:12px;
  line-height:20px;
}
.complete{
  margin-top:8px;
  font-weight:bold;
  color:#ff9900;
  font-size:18px;
}
</style>

</head>

<header>

<h1>

</header>



<main>



<section class="box">

<div id="series-rate">

<div id="character-rate"></div>

<input

<select id="character">

<option>
すべてのキャラクター
</option>

</select>



<select id="sort">

</option>

<option value="character">

</option>

<select id="wave">

</select>

<select id="miracle">

<option value="none">通常のみ</option>
</select>

<select id="surprise">
<option value="all">サプライズ全て</option>
<option value="S">サプライズのみ</option>
<option value="none">通常のみ</option>
</select>
    
</div>

<button id="dark-mode">

</button>


<div class="radio-area">


<label>
<input type="radio" name="view" value="all" checked>

全部
</label>


<label>
<input type="radio" name="view" value="owned">

所持のみ
</label>


<label>
<input type="radio" name="view" value="missing">

未所持のみ
</label>



<label>
<input type="radio" name="view" value="favorite">

お気に入り
</label>


</div>



</section>






<section class="box">


<h2>
🃏 カード一覧
</h2>


<div id="card-list">

</div>


</section>



</main>

// =========================
// カード表示
// =========================

function displayCards(){

  let list=[...cards];
    
// 表示切替

// 検索
if(searchText){

  list = list.filter(card => {

    let text =
      card.id +
      card.name +
      card.character +
      card.series;

    return text
      .toLowerCase()
      .includes(searchText.toLowerCase());

  });

}

// シリーズ
if(seriesFilter !== "all"){

  list = list.filter(card =>
    card.series === seriesFilter
  );

}

// 何弾
if(waveFilter !== "all"){

  list = list.filter(card =>
    card.wave === waveFilter
  );

}

// ミラクル
if(miracleFilter === "M"){

  list = list.filter(card =>
    card.miracle === "M"
  );

}

// サプライズ
if(surpriseFilter === "S"){

  list = list.filter(card =>
    card.id.endsWith("P")
  );

}
// キャラクター
if(characterFilter !== "all"){

  console.log("選択:", "[" + characterFilter + "]");

  list = list.filter(card => {

    console.log("カード:", "[" + card.character + "]");

    return card.character === characterFilter;

  });

}
    
if(currentView==="owned"){


list=list.filter(card=>

saveData[card.id]

);


}


if(currentView==="missing"){


list=list.filter(card=>

!saveData[card.id]

);


}


if(currentView==="favorite"){


list=list.filter(card=>

favoriteData[card.id]

);


}




// 並び替え

list.sort((a,b)=>{


if(sortType==="name"){

return a.name.localeCompare(b.name);

}


if(sortType==="character"){

return a.character.localeCompare(b.character);

}


if(sortType==="series"){

return a.series.localeCompare(b.series);

}


return a.id.localeCompare(b.id);


});



// 表示

const area =
document.getElementById(
"card-list"
);


area.innerHTML="";



list.forEach(card=>{


let div =
document.createElement(
"div"
);


div.className="card";



let owned =
saveData[card.id];


let fav =
favoriteData[card.id];



div.innerHTML=

`

<img src="${card.image}"
onerror="this.alt='画像準備中';"
onclick="openImage('${card.image}')">


<h3>${card.id}</h3>

<p>${card.series}</p>

<p>${card.character}</p>

<p>${card.name}</p>


<div class="favorite"
onclick="toggleFavorite('${card.id}')">

${fav ? "❤️":"♡"}

</div>


<button onclick="toggleOwned('${card.id}')">

${owned ? 
"☑ 所持中":
"□ 未所持"}

</button>


`;



area.appendChild(div);



});



updateRate();


}

// =========================
// シリーズ別所持率
// =========================

function updateSeriesRate(){

  const area =
  document.getElementById(
    "series-rate"
  );

  area.innerHTML = "";

  let seriesList =
  [...new Set(
    cards.map(card =>
      card.series
    )
  )];

  seriesList.forEach(series => {

    let total =
    cards.filter(card =>
      card.series === series
    ).length;

    let owned =
    cards.filter(card =>
      card.series === series &&
      saveData[card.id]
    ).length;

    let rate =
    total
      ? Math.round(
          owned / total * 100
        )
      : 0;

area.innerHTML +=
`
<div class="series-stat">

  <b>${series}</b><br>

  <div class="progress-bar">

    <div
      class="progress-fill"
      style="width:${rate}%"
    >
      ${rate}%
    </div>

  </div>

${owned} / ${total}枚

${
  rate === 100
  ? "<div class='complete'>🏆 COMPLETE</div>"
  : `<div class="remain">
       あと ${total - owned} 枚でCOMPLETE
     </div>`
}

</div>
`;
  });

}
// =========================
// キャラクター別所持率
// =========================

function updateCharacterRate(){

  const area =
  document.getElementById(
    "character-rate"
  );

  area.innerHTML = "";

  let characterList =
  [...new Set(
    cards
      .map(card => card.character)
      .filter(name => name)
  )];

  characterList.sort();

  characterList.forEach(character => {

    let total =
    cards.filter(card =>
      card.character === character
    ).length;

    let owned =
    cards.filter(card =>
      card.character === character &&
      saveData[card.id]
    ).length;

    let rate =
    total
      ? Math.round(
          owned / total * 100
        )
      : 0;

    area.innerHTML +=
    `
    <div class="series-stat">

      <b>${character}</b><br>

      <div class="progress-bar">

        <div
          class="progress-fill"
          style="width:${rate}%"
        >
          ${rate}%
        </div>

      </div>

      ${owned} / ${total}枚

    </div>
    `;
  });

}

function toggleOwned(id){

    saveData[id] =
    !saveData[id];


    localStorage.setItem(
        "ipri_owned",
        JSON.stringify(saveData)
    );


    displayCards();
updateSeriesRate();
updateCharacterRate();

}



// =========================
// 所持率更新
// =========================

function updateRate(){

    const total =
    cards.length;


    const owned =
    cards.filter(card=>
        saveData[card.id]
    ).length;



    const percent =
    total===0
    ?
    0
    :
    Math.round(
        owned / total * 100
    );



    document.getElementById(
        "owned-count"
    ).textContent =
    owned;



    document.getElementById(
        "total-count"
    ).textContent =
    total;



    document.getElementById(
        "percent"
    ).textContent =
    percent+"%";



    document.getElementById(
        "remain"
    ).textContent =
    total-owned;



    document.getElementById(
        "bar"
    ).style.width =
    percent+"%";


}

  const data = {

    owned: saveData,

    favorite: favoriteData

  };


  const blob = new Blob(
    [JSON.stringify(data)],
    { type: "application/json" }
  );

  const a =
  document.createElement("a");

  a.href =
  URL.createObjectURL(blob);

  a.download =
  "ipri-backup.json";

  a.click();

});

document
.getElementById("import-data")
.addEventListener("change", e => {

  const file =
  e.target.files[0];

  if(!file) return;

  const reader =
  new FileReader();

  reader.onload = () => {

    const data =
    JSON.parse(reader.result);

    saveData =
    data.owned || {};

    favoriteData =
    data.favorite || {};

    localStorage.setItem(
      "ipri_owned",
      JSON.stringify(saveData)
    );

    localStorage.setItem(
      "ipri_favorite",
      JSON.stringify(favoriteData)
    );

    displayCards();

    alert("復元完了");

  };

  reader.readAsText(file);

});

displayCards();
    
updateRate();

updateSeriesRate();

updateCharacterRate();
